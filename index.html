  const label = type==='lang'?'语言':'技能';
  state.module = mid; state.sub = sid; state.guest = false; state.sched = null;
  const items = loadSkillItems(type);
  const now = new Date(), y = now.getFullYear(), mo = now.getMonth();
  const first = new Date(y, mo, 1).getDay();
  const days = new Date(y, mo + 1, 0).getDate();
  const today = nowStr();
  const monthKey = y+'-'+String(mo+1).padStart(2,'0');

  function miniCal(chk, idx){
    let c='';
    ['一','二','三','四','五','六','日'].forEach(h=>c+=`<div class="mh">${h}</div>`);
    for(let i=0;i<first;i++)c+=`<div class="md blank"></div>`;
    for(let d=1;d<=days;d++){
      const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const ch=chk[ds];
      c+=`<div class="md ${ch?'done':''} ${ds===today?'today':''}" data-skday="${type}__${idx}__${ds}" title="${ch?(ch.note||'已打卡'):'未打卡'}"><div class="dn">${d}</div>${ch?'<div class="dv" style="color:var(--pink)">✓</div>':''}</div>`;
    }
    return c;

  const cardsHTML = items.length ? items.map((it, idx) => {

    const monthLogs = Object.keys(chk).filter(d=>d.startsWith(monthKey)).sort();

    const logEntries = Object.keys(chk).sort().reverse().slice(0,5);
    const sel = state.skSel && state.skSel.type===type && state.skSel.idx===idx ? state.skSel : null;
    const selDetail = sel && chk[sel.date] ? `
      <div class="skdetail">
        <div style="font-weight:700;margin-bottom:4px">📅 ${sel.date} 打卡</div>
        <div style="white-space:pre-wrap">${esc(chk[sel.date].note||'（无备注）')}</div>
        ${chk[sel.date].img?`<img src="${chk[sel.date].img}" data-lb style="width:150px;max-width:100%;border-radius:8px;margin-top:6px;cursor:pointer">`:''}
        <div style="margin-top:8px"><button class="delbtn" data-skchkdel="${type}__${idx}__${sel.date}" style="font-size:12px">删除这次打卡</button></div>
      </div>` : '';
    return `<div class="feat" style="margin-bottom:18px;padding-bottom:4px">

        <b style="color:var(--pink);font-size:16px">${esc(it.name||'未命名')}</b>

/* --- 每日学习计划增强：月汇总/年汇总 --- */
function renderPlanSummary(mid, sid) {
  const m = findModule(mid), s = findSub(mid, sid);
  if (!m || !s) return renderModule(mid);
  state.module = mid; state.sub = sid; state.guest = false;
  const plan = loadStudyPlan();
  const now = new Date(), y = now.getFullYear(), mo = now.getMonth();
  
  // Calculate monthly stats
  let monthStats = [];
  for (let month = 0; month <= mo; month++) {
    const prefix = `${y}-${String(month+1).padStart(2,'0')}`;
    let total = 0, done = 0;
    Object.keys(plan).forEach(day => {
      if (day.startsWith(prefix)) {
        plan[day].forEach(item => {
          total++;
          if (item.done) done++;
        });
      }
    });
    monthStats.push({ month: month+1, total, done, pct: total ? Math.round(done/total*100) : 0 });
  }
  
  // Year total
  let yearTotal = 0, yearDone = 0;
  Object.keys(plan).forEach(day => {
    if (day.startsWith(String(y))) {
      plan[day].forEach(item => {
        yearTotal++;
        if (item.done) yearDone++;
      });
    }
  });
  
  // Monthly view
  let monthGrid = '';
  monthStats.forEach(ms => {
    monthGrid += `<div class="ym"><b>${ms.month}月</b><div class="bar"><i style="width:${ms.pct}%"></i></div><div style="font-size:11px;color:var(--ink-faint);margin-top:4px">${ms.done}/${ms.total} 完成 ${ms.pct}%</div></div>`;
  });
  
  // Year view
  let yearGrid = '';
  for (let year = y; year >= y-2; year--) {
    let yt = 0, yd = 0;
    Object.keys(plan).forEach(day => {
      if (day.startsWith(String(year))) {
        plan[day].forEach(item => {
          yt++;
          if (item.done) yd++;
        });
      }
    });
    yearGrid += `<div class="ym"><b>${year}年</b><div class="bar"><i style="width:${yt?Math.round(yd/yt*100):0}%"></i></div><div style="font-size:11px;color:var(--ink-faint);margin-top:4px">${yd}/${yt} 完成</div></div>`;
  }

  view.innerHTML = `
    <nav class="crumbs"><button data-nav="home">Back to Room</button><span class="sep">/</span><button data-nav="module-study">学习计划</button><span class="sep">/</span><span class="cur">每日学习计划</span></nav>

      <div><div class="colnum">STUDY · PLAN</div><h1>🗓 每日学习计划</h1><p>时间点+时间段安排学习，月汇总年汇总见证你的成长。</p></div>
      <div class="stat">今年共 ${yearTotal} 项 · 完成 ${yearDone} 项</div>
    </div>
    <div class="deco">✦ 学习成长轨迹 ✦</div>
    <div class="detail">
      <div class="panel" style="--cc:${m.cc}">
        <div class="toolbar">
          <div class="ph" style="margin:0"><span class="ic">🗓</span> <input type="date" id="planDay" value="${nowStr()}" style="font-size:15px;font-family:inherit;border:1px solid var(--line2);border-radius:10px;padding:5px 10px;background:#FDF6FA;color:var(--ink)"></div>
          <button class="addbtn" data-addplan="${nowStr()}" style="--cc:${m.cc}">＋ 添加安排</button>
        </div>
        <div class="pd">每项都有开始时间和结束时间，完成就打勾 ✓</div>
        <div class="planstat">
          <div class="ps"><b>${(plan[nowStr()]||[]).length}</b><span>今日计划</span></div>
          <div class="ps"><b style="color:var(--mint)">${(plan[nowStr()]||[]).filter(i=>i.done).length}</b><span>已完成</span></div>
        </div>
        <div class="planitem-list">${(plan[nowStr()]||[]).length ? (plan[nowStr()]||[]).map((it,i) => `

/* 番茄钟事件绑定函数 - 在渲染后调用 */
function bindPomodoroEvents() {
  var startBtn = document.getElementById('pomoStart');
  var stopBtn = document.getElementById('pomoStop');
  var resetBtn = document.getElementById('pomoReset');
  if (startBtn) startBtn.addEventListener('click', startPomodoro);
  if (stopBtn) stopBtn.addEventListener('click', stopPomodoro);
  if (resetBtn) resetBtn.addEventListener('click', resetPomodoro);
  var addTaskBtn = document.getElementById('pomoAddTask');
  if (addTaskBtn) {
    addTaskBtn.addEventListener('click', function() {
      var taskName = prompt('请输入任务名称：');
      if (!taskName) return;
      var taskDur = prompt('请输入预计时长（分钟）：', '25');
      var tasks = loadPomoTasks();
      var newId = tasks.length ? Math.max.apply(null, tasks.map(function(t){return t.id;})) + 1 : 1;
      tasks.push({id: newId, name: taskName, duration: taskDur || '25', done: false, status: '进行中', ts: Date.now()});
      savePomoTasks(tasks);
      renderPomoTasks();
    });
  }
  document.querySelectorAll('[data-pomotasktxt]').forEach(function(el) {
    el.addEventListener('blur', function() {
      var id = this.dataset.pomotasktxt;
      var tasks = loadPomoTasks();
      var t = tasks.find(function(x){return x.id == id;});
      if (t) { t.name = this.textContent.trim(); savePomoTasks(tasks); if (t.id === pomoCurrentId) updatePomoCurrentLabel(); }
    });
  });
  document.querySelectorAll('[data-pomotaskdur]').forEach(function(el) {
    el.addEventListener('dblclick', function() {
      var newDur = prompt('修改时长（分钟）：', this.textContent);
      if (newDur !== null) {
        var id = this.dataset.pomotaskdur;
        var tasks = loadPomoTasks();
        var t = tasks.find(function(x){return x.id == id;});
        if (t) { t.duration = newDur; savePomoTasks(tasks); this.textContent = newDur + '分钟'; }
      }
    });
  });
  document.querySelectorAll('[data-pomotaskstatus]').forEach(function(el) {
    el.addEventListener('dblclick', function() {
      var newStatus = this.textContent === '进行中' ? '已完成' : '进行中';
      var id = this.dataset.pomotaskstatus;
      var tasks = loadPomoTasks();
      var t = tasks.find(function(x){return x.id == id;});
      if (t) { t.status = newStatus; savePomoTasks(tasks); this.textContent = newStatus; }
    });
  });
  if (typeof renderPomoTasks === 'function') renderPomoTasks();
  var taskInput = document.getElementById('pomoTaskInput');
  if (taskInput) {
    taskInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') { commitPomoTaskInput(); } });
    taskInput.addEventListener('blur', commitPomoTaskInput);
  }
  var minutesEl = document.getElementById('pomoMinutes');
  if (minutesEl) {
    minutesEl.addEventListener('change', function() {
      if (!pomoRunning) {
        pomoSeconds = (parseInt(minutesEl.value) || 25) * 60;
        updatePomoDisplay();
      }
    });
  }
  updatePomoCurrentLabel();
  if (typeof restorePomodoroSession === 'function') restorePomodoroSession();
}

/* --- 收支流水：共享分类/日期解析 --- */
const FLOW_INC=['工资','奖金','理财','兼职','红包','礼金','收入','稿费','报销','投资收益'];
const FLOW_EXP=['餐饮','交通','购物','娱乐','居住','日用','医疗','教育','支出','水电','通讯','服饰'];
function flowClassify(r){
  const v0=String(r.vals[0]||''),v1=String(r.vals[1]||''),v3=String(r.vals[3]||'');
  if(/结余|余额|汇总/.test(v0))return {type:'balance',amount:0,cat:v0};
  let type=null;
  if(/收入|工资|奖金|理财|兼职|红包|礼金|稿费|报销|投资收益/.test(v1))type='income';
  else if(/支出|餐饮|交通|购物|娱乐|居住|日用|医疗|教育|水电|通讯|服饰/.test(v1))type='expense';
  if(!type)type=FLOW_INC.some(c=>v0.includes(c))?'income':(FLOW_EXP.some(c=>v0.includes(c))?'expense':null);
  if(!type)type=v3==='income'?'income':(v3==='expense'?'expense':null);
  let num=parseFloat(String(v1).replace(/[^\d.\-]/g,''))||parseFloat(String(v0).replace(/[^\d.\-]/g,''))||0;
  if(num<0){type=type||'expense';num=Math.abs(num);}
  if(!type)type='income';
  return {type,amount:Math.abs(num),cat:v0};
}
function flowRowDate(r){
  let d=String(r.vals[2]||'').trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(d))return d;
  if(d==='今天')return nowStr();
  if(d==='昨天'){const dt=new Date();dt.setDate(dt.getDate()-1);return dkey(dt);}
  const m1=d.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m1)return m1[1]+'-'+String(+m1[2]).padStart(2,'0')+'-'+String(+m1[3]).padStart(2,'0');
  const m2=d.match(/^(\d{1,2})月(\d{1,2})日/);
  if(m2)return new Date().getFullYear()+'-'+String(+m2[1]).padStart(2,'0')+'-'+String(+m2[2]).padStart(2,'0');
  return nowStr();
}
function buildFlowDayMap(rows){
  const dayMap={};
  rows.forEach(r=>{
    const dt=flowRowDate(r),c=flowClassify(r);
    if(c.type==='balance')return;
    if(!dayMap[dt])dayMap[dt]={inc:0,exp:0,items:[]};
    if(c.type==='income')dayMap[dt].inc+=c.amount;else dayMap[dt].exp+=c.amount;
    dayMap[dt].items.push({cat:c.cat,sub:(r.vals[4]||''),remark:(r.vals[5]||''),amount:c.amount,type:c.type,date:dt});
  });
  return dayMap;
}
function flowMonthStat(dayMap,prefix){
  let inc=0,exp=0,cnt=0;
  Object.keys(dayMap).forEach(d=>{if(d.startsWith(prefix)){inc+=dayMap[d].inc;exp+=dayMap[d].exp;cnt+=dayMap[d].items.length;}});
  return {inc,exp,cnt};
}

  state.module=mid;state.sub=sid;state.guest=false;state.sched=null;
  const rows=loadRows(mid,sid);
  function norm(r){
    const v=r.vals||[];
    if(v.length>=5){return {name:String(v[0]||''),type:String(v[1]||'')||'未分类',loc:String(v[2]||'')||'未指定',qty:String(v[3]||''),val:String(v[4]||''),note:String(v[5]||'')};}
    const p0=String(v[0]||'').split('·');
    const p1=String(v[1]||'').split(/[·/]/);
    return {name:(p0.length>1?p0[1]:p0[0]).trim(),type:p0.length>1?p0[0].trim():'未分类',loc:(p1.length>1?p1[0]:'').trim()||'未指定',qty:p1.length>1?p1[1].trim():'',val:String(v[2]||''),note:''};
  }
  const items=rows.map(r=>({row:r,n:norm(r)}));
  const customTypes=loadItemTypes();
  const customLocs=loadItemLocs();
  const types=['全部'].concat(Array.from(new Set(customTypes.concat(items.map(x=>x.n.type)))).filter(Boolean));
  const locs=['全部'].concat(Array.from(new Set(customLocs.concat(items.map(x=>x.n.loc)))).filter(Boolean));
  if(!state.itemType||!types.includes(state.itemType))state.itemType='全部';
  if(!state.itemLoc||!locs.includes(state.itemLoc))state.itemLoc='全部';
  const filtered=items.filter(x=>(state.itemType==='全部'||x.n.type===state.itemType)&&(state.itemLoc==='全部'||x.n.loc===state.itemLoc));
  const totalVal=filtered.reduce((a,x)=>{const n=parseFloat(String(x.n.val).replace(/[^\d.]/g,''));return a+(isNaN(n)?0:n);},0);
  const typeTags=customTypes.length?customTypes.map((t,i)=>`<span class="it-tag">${esc(t)}<b data-ittypedel="${i}">×</b></span>`).join(''):'<span style="color:var(--ink-faint)">暂无自定义种类</span>';
  const locTags=customLocs.length?customLocs.map((t,i)=>`<span class="it-tag">${esc(t)}<b data-itlocdel="${i}">×</b></span>`).join(''):'<span style="color:var(--ink-faint)">暂无自定义位置</span>';
  view.innerHTML=`
    <nav class="crumbs"><button data-nav="home">Back to Room</button><span class="sep">/</span><button data-nav="module-assets">家庭资产</button><span class="sep">/</span><span class="cur">物品档案</span></nav>
    <div class="pagehead">
      <div><div class="colnum">ASSETS · ITEMS</div><h1>${s.ic} ${esc(s.name)}</h1><p>${esc(s.desc)}</p></div>
      <div class="stat">${rows.length} 件物品</div>
    </div>
    <div class="deco">✦ 物归其位 ✦</div>
    <div class="detail">
      <div class="panel" style="--cc:${m.cc}">
        <div class="ph"><span class="ic">➕</span> 新增物品（按种类与位置登记）</div>
        <div class="pd">登记物品名称、种类与存放位置，之后可按这两个维度筛选查看。</div>
        <div class="measureform" style="grid-template-columns:1fr 1fr 1fr">
          <div class="mf"><label>物品名称</label><input id="it_name" type="text" placeholder="如 相机"></div>
          <div class="mf"><label>物品种类</label><input id="it_type" type="text" placeholder="如 数码 / 家电 / 书籍" list="itTypeList" autocomplete="off"></div>
          <div class="mf"><label>存放位置</label><input id="it_loc" type="text" placeholder="如 书房 / 厨房" list="itLocList" autocomplete="off"></div>
        </div>
        <div class="measureform" style="grid-template-columns:1fr 1fr 1fr">
          <div class="mf"><label>数量</label><input id="it_qty" type="text" placeholder="如 1 台 / 42 本"></div>
          <div class="mf"><label>价值 / 单价</label><input id="it_val" type="text" placeholder="如 ¥6,800"></div>
          <div class="mf"><label>备注（可选）</label><input id="it_note" type="text" placeholder="如 保修至2028年"></div>
        </div>
        <datalist id="itTypeList">${types.filter(t=>t!=='全部').map(t=>`<option value="${esc(t)}">`).join('')}</datalist>
        <datalist id="itLocList">${locs.filter(t=>t!=='全部').map(t=>`<option value="${esc(t)}">`).join('')}</datalist>
        <button class="addbtn" id="itSave" style="--cc:${m.cc};margin-top:14px">保存物品</button>
        <div style="margin-top:14px;padding:12px 14px;background:#F6F0FB;border:1px solid var(--line2);border-radius:12px;font-size:12.5px;color:var(--ink-dim)">
          <b style="color:var(--ink)">⚙ 自定义种类与位置</b>
          <div style="font-size:12px;color:var(--ink-faint);margin-top:2px">添加后会在新增表单与筛选中出现；登记新物品时，新种类/位置也会自动加入。</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center">
            <span style="font-weight:700;color:var(--ink);flex:none">种类</span>
            <input id="itNewType" type="text" placeholder="新种类" style="width:110px;padding:6px 10px;border:1px solid var(--line2);border-radius:8px;font-size:12.5px;background:#fff;font-family:inherit" autocomplete="off">
            <button class="addbtn" id="itAddType" style="--cc:${m.cc};padding:5px 12px;font-size:12px;flex:none">＋ 添加</button>
            <span style="display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center">${typeTags}</span>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center">
            <span style="font-weight:700;color:var(--ink);flex:none">位置</span>
            <input id="itNewLoc" type="text" placeholder="新位置" style="width:110px;padding:6px 10px;border:1px solid var(--line2);border-radius:8px;font-size:12.5px;background:#fff;font-family:inherit" autocomplete="off">
            <button class="addbtn" id="itAddLoc" style="--cc:${m.cc};padding:5px 12px;font-size:12px;flex:none">＋ 添加</button>
            <span style="display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center">${locTags}</span>
          </div>
        </div>
      </div>
      <div class="panel" style="--cc:${m.cc}">
        <div class="ph"><span class="ic">🗂️</span> 物品分类清单</div>
        <div class="pd">按「物品种类」和「物品位置」两个维度筛选，快速找到想要的东西。</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 14px;align-items:center">
          <label style="font-size:13px;color:var(--ink-dim)">种类</label>
          <select id="itFilterType" style="padding:6px 12px;border:1px solid var(--line2);border-radius:8px;font-size:13px;background:#FDF6FA;color:var(--ink)">${types.map(t=>`<option ${t===state.itemType?'selected':''}>${esc(t)}</option>`).join('')}</select>
          <label style="font-size:13px;color:var(--ink-dim)">位置</label>
          <select id="itFilterLoc" style="padding:6px 12px;border:1px solid var(--line2);border-radius:8px;font-size:13px;background:#FDF6FA;color:var(--ink)">${locs.map(t=>`<option ${t===state.itemLoc?'selected':''}>${esc(t)}</option>`).join('')}</select>
          <span style="font-size:12px;color:var(--ink-faint)">当前筛选 ${filtered.length} 件 · 总价值 ¥${totalVal.toFixed(2)}</span>
        </div>
        <div style="overflow-x:auto">
        <table style="table-layout:fixed;min-width:560px">
          <thead><tr><th style="width:6%">#</th><th style="width:18%">物品</th><th style="width:12%">种类</th><th style="width:12%">位置</th><th style="width:10%">数量</th><th style="width:12%">价值</th><th style="width:22%">备注</th><th style="width:8%">操作</th></tr></thead>
          <tbody>
            ${filtered.length?filtered.map((x,i)=>`
              <tr><td style="color:var(--ink-faint)">${i+1}</td><td>${esc(x.n.name)}</td><td><span style="background:${m.cc}33;color:var(--ink);padding:2px 8px;border-radius:999px;font-size:12px">${esc(x.n.type)}</span></td><td>${esc(x.n.loc)}</td><td>${esc(x.n.qty)}</td><td>${esc(x.n.val)}</td><td style="color:var(--ink-dim)">${esc(x.n.note)}</td><td><button class="delbtn" data-itdel="${rows.indexOf(x.row)}">删除</button></td></tr>
            `).join(''):`<tr><td colspan="8"><div class="empty">暂无符合条件的物品，先在上方登记一件吧</div></td></tr>`}
          </tbody>
        </table>
        </div>
      </div>
    </div>`;
  const ft=document.getElementById('itFilterType'),fl=document.getElementById('itFilterLoc');
  if(ft)ft.addEventListener('change',()=>{state.itemType=ft.value;renderItems(mid,sid);});
  if(fl)fl.addEventListener('change',()=>{state.itemLoc=fl.value;renderItems(mid,sid);});
  const addT=document.getElementById('itAddType'),addL=document.getElementById('itAddLoc');
  const nt=document.getElementById('itNewType'),nl=document.getElementById('itNewLoc');
  if(addT)addT.addEventListener('click',()=>{
    const v=(nt.value||'').trim();if(!v){toast('请输入种类名称');return;}
    const arr=loadItemTypes();if(arr.includes(v)){toast('该种类已存在');return;}
    arr.push(v);saveItemTypes(arr);nt.value='';renderItems(mid,sid);
  });
  if(addL)addL.addEventListener('click',()=>{
    const v=(nl.value||'').trim();if(!v){toast('请输入位置名称');return;}
    const arr=loadItemLocs();if(arr.includes(v)){toast('该位置已存在');return;}
    arr.push(v);saveItemLocs(arr);nl.value='';renderItems(mid,sid);
  });
}
let pomoRunning=false,pomoInterval=null,pomoMode="countdown",pomoSeconds=25*60,pomoStartTimestamp=0,pomoCurrentId=null;
/* ---- 番茄钟持久化：把"进行中/暂停"的会话存起来，退出或关页面后再进能恢复 ---- */
function loadPomoSession(){try{const r=localStorage.getItem(PREFIX+'pomo_session');if(r)return JSON.parse(r);}catch(e){}return null;}
function savePomoSession(s){try{if(s)localStorage.setItem(PREFIX+'pomo_session',JSON.stringify(s));else localStorage.removeItem(PREFIX+'pomo_session');}catch(e){}}
function finishPomodoro(){
  alert('🍅 番茄时间到！休息一下吧~');
  pomoSeconds=25*60;
  try{
    const statsRaw=localStorage.getItem(PREFIX+'pomo_stats');
    const stats=statsRaw?JSON.parse(statsRaw):{today:0,todayMin:0};
    stats.today=(stats.today||0)+1;
    stats.todayMin=(stats.todayMin||0)+25;
    localStorage.setItem(PREFIX+'pomo_stats',JSON.stringify(stats));
  }catch(e){}
  savePomoSession(null);
  updatePomoDisplay();
}
function startPomodoro() {
  if (pomoRunning) return;
  if (!pomoCurrentId) {
    const tasks = loadPomoTasks();
    const t = tasks.find(x => !x.done) || tasks[0];
    if (t) { pomoCurrentId = t.id; updatePomoCurrentLabel(); }
  }
  pomoMode = document.getElementById('pomoMode')?.value || 'countdown';
  pomoStartTimestamp = Date.now();
  updatePomoCurrentLabel();
  const sess=loadPomoSession();
  if(pomoMode==='countdown'){
    let secs=(sess&&sess.mode==='countdown'&&sess.remain!=null)?sess.remain:pomoSeconds;
    if(!(secs>0))secs=pomoSeconds;
    pomoSeconds=secs;
    savePomoSession({mode:pomoMode,end:Date.now()+secs*1000,remain:null,currentId:pomoCurrentId});
  }else{
    let secs=(sess&&sess.mode==='countup'&&sess.remain!=null)?sess.remain:0;
    pomoSeconds=secs;
    savePomoSession({mode:pomoMode,end:null,remain:secs,currentId:pomoCurrentId});
  }
  pomoRunning = true;
  updatePomoDisplay();
  pomoInterval = setInterval(() => {
    const s2=loadPomoSession();
    if(pomoMode==='countdown'){
      if(s2&&s2.end){
        const rem=Math.max(0,Math.ceil((s2.end-Date.now())/1000));
        pomoSeconds=rem;updatePomoDisplay();
        if(rem<=0){stopPomodoro();finishPomodoro();}
      }
    }else{
      pomoSeconds++;updatePomoDisplay();
      const s3=loadPomoSession();if(s3){s3.remain=pomoSeconds;savePomoSession(s3);}
    }
  }, 1000);
}

function stopPomodoro() {
  pomoRunning = false;
  if (pomoInterval) { clearInterval(pomoInterval); pomoInterval = null; }
  const s2=loadPomoSession();
  if(s2){if(pomoMode==='countdown'){s2.remain=pomoSeconds;s2.end=null;}else{s2.remain=pomoSeconds;}savePomoSession(s2);}
}

function resetPomodoro() {
  stopPomodoro();
  const mins = parseInt(document.getElementById('pomoMinutes')?.value || '25');
  pomoSeconds = mins * 60;
  savePomoSession(null);
  updatePomoDisplay();
}

function updatePomoDisplay() {
  const el = document.getElementById('pomoDisplay');
  if (!el) return;
  const m = Math.floor(pomoSeconds / 60);
  const s = pomoSeconds % 60;
  el.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}
/* 进入番茄钟页时：若上次有进行中/暂停的会话，自动恢复 */
function restorePomodoroSession(){
  const sess=loadPomoSession();
  if(!sess)return;
  const modeSel=document.getElementById('pomoMode');
  if(modeSel)modeSel.value=sess.mode;
  pomoMode=sess.mode;
  if(sess.currentId!=null)pomoCurrentId=sess.currentId;
  updatePomoCurrentLabel();
  if(sess.mode==='countdown'){
    if(sess.end){
      const rem=Math.ceil((sess.end-Date.now())/1000);
      if(rem>0){pomoSeconds=rem;pomoRunning=false;startPomodoro();}
      else{pomoSeconds=0;updatePomoDisplay();finishPomodoro();}
    }else if(sess.remain!=null){pomoSeconds=sess.remain;updatePomoDisplay();}
  }else{
    pomoSeconds=sess.remain||0;updatePomoDisplay();
  }
}
/* 在“当前任务”处直接输入并设定当前任务 */
function commitPomoTaskInput() {
  const el = document.getElementById('pomoTaskInput');
  if (!el) return;
  const name = el.value.trim();
  el.value = '';
  if (!name) return;
  if (pomoRunning) return;
  let tasks = loadPomoTasks();
  let t = tasks.find(x => x.name === name && !x.done);
  if (!t) {
    const newId = tasks.length ? Math.max.apply(null, tasks.map(x => x.id)) + 1 : 1;
    t = { id: newId, name: name, duration: '25', done: false, status: '进行中', ts: Date.now() };
    tasks.push(t);
    savePomoTasks(tasks);
  }
  pomoCurrentId = t.id;
  updatePomoCurrentLabel();
  if (typeof renderPomoTasks === 'function') renderPomoTasks();
}
function loadPomoTasks(){try{const r=localStorage.getItem(PREFIX+'pomo_tasks');if(r!==null)return JSON.parse(r);}catch(e){}return [];}
function savePomoTasks(t){try{localStorage.setItem(PREFIX+'pomo_tasks',JSON.stringify(t));}catch(e){}}
function renderPomoTasks(){
  const tasks=loadPomoTasks();
  const container=document.getElementById('pomoTasks');
  if(!container)return;
  container.innerHTML=tasks.map(t=>`
    <div class="planitem ${t.done?'done':''} ${t.id===pomoCurrentId?'sel':''}" data-pomotask="${t.id}">
      <span class="ck" data-pomotoggle="${t.id}">${t.done?'✓':''}</span>
      <div class="pt">
        <div class="ptt" contenteditable="true" data-pomotasktxt="${t.id}">${esc(t.name)}</div>
        <div class="ptd"><span data-pomotaskdur="${t.id}">${t.duration}分钟</span> · <span data-pomotaskstatus="${t.id}">${t.status}</span></div>
      </div>
      <button class="pdel" data-pomotdel="${t.id}">删除</button>
    </div>`).join('');
}
/* 更新番茄钟“当前任务”显示 */
function updatePomoCurrentLabel(){
  const el=document.getElementById('pomoTask');
  if(!el)return;
  const tasks=loadPomoTasks();
  const t=pomoCurrentId?tasks.find(x=>x.id===pomoCurrentId):null;
  el.textContent=t?('当前任务：'+t.name):'当前任务：（点击下方待办选择）';
}

/* 备忘录文件夹切换 */
document.addEventListener('click', e => {
  const folder = e.target.closest('[data-memofolder]');
  if (folder) {
    state.activeFolder = folder.dataset.memofolder;
    renderSub('utility', 'memo');
    return;
  }
  const memodel2 = e.target.closest('[data-memodel]');
  if (memodel2) {
    const folder = memodel2.dataset.mefolder;
    let folders = [];
    try { const raw = localStorage.getItem(PREFIX + 'memo_folders'); if (raw) folders = JSON.parse(raw); } catch(e) {}
    const fIdx = folders.findIndex(f => f.name === folder);
    if (fIdx > -1 && folders[fIdx].items) {
      const idx = +memodel2.dataset.memodel;
      folders[fIdx].items.splice(idx, 1);
      localStorage.setItem(PREFIX + 'memo_folders', JSON.stringify(folders));
      render();
    }
    return;
  }
  const flowdel = e.target.closest('[data-flowdel]');
  if (flowdel) {
    if (!confirm('删除这条收支记录？')) return;
    const rows = loadRows('money', 'flow');
    rows.splice(+flowdel.dataset.flowdel, 1);
    saveRows('money', 'flow', rows);
    render();
    return;
  }
  const meddel = e.target.closest('[data-meddel]');
  if (meddel) {
    if (!confirm('删除这条用药记录？')) return;
    const rows = loadRows('health', 'meds');
    rows.splice(+meddel.dataset.meddel, 1);
    saveRows('health', 'meds', rows);
    render();
    return;
  }
  const mediadel = e.target.closest('[data-mediadel]');
  if (mediadel) {
    if (!confirm('删除这条影视记录？')) return;
    const rows = loadRows('growth', 'media');
    rows.splice(+mediadel.dataset.mediadel, 1);
    saveRows('growth', 'media', rows);
    render();
    return;
  }
  const gbdel = e.target.closest('[data-gbdel]');
  if (gbdel) {
    handleGbDelete(gbdel.dataset.gbdel);
    return;
  }
  const skdel = e.target.closest('[data-skdel]');
  if (skdel) {
    if (!confirm('删除这条技能记录？')) return;
    const rows = loadRows('growth', 'skill');
    rows.splice(+skdel.dataset.skdel, 1);
    saveRows('growth', 'skill', rows);
    render();
    return;
  }
  const crdel = e.target.closest('[data-crdel]');
  if (crdel) {
    if (!confirm('删除这条职业记录？')) return;
    const rows = loadRows('timeline', 'career');
    rows.splice(+crdel.dataset.crdel, 1);
    saveRows('timeline', 'career', rows);
    render();
    return;
  }
  const medfdel = e.target.closest('[data-medfdel]');
  if (medfdel) {
    const [idx, fi] = medfdel.dataset.medfdel.split('__');
    const rows = loadRows('health', 'meds');
    const r = rows[idx];
    if (r && r.files) { r.files.splice(+fi, 1); saveRows('health', 'meds', rows); render(); }
    return;
  }
});

    <label class="upbtn" style="margin-top:2px">📎 上传图片或文件<input id="mm_file" type="file" multiple accept="image/*,.pdf,.doc,.docx,.txt,.xls,.xlsx" style="display:none"></label>

function saveMemoFolderForm(){
  if(!fmMeta||fmMeta.type!=='memofolder')return;
  const title=($('[data-f="0"]').value||'').trim();
  if(!title){toast('给备忘起个标题吧');return;}
  const content=($('[data-f="1"]').value||'').trim();
  const date=($('[data-f="2"]').value||'').trim()||nowStr();
  let folders=[];
  try{const raw=localStorage.getItem(PREFIX+'memo_folders');if(raw)folders=JSON.parse(raw);}catch(e){}
  if(!folders.length)folders=[{name:'默认',color:'#E88CA8',items:[]}];
  const fIdx=folders.findIndex(f=>f.name===fmMeta.folder);
  if(fIdx===-1)folders.push({name:fmMeta.folder,color:HABIT_COLORS[folders.length%HABIT_COLORS.length],items:[]});
  const folder=folders[fIdx===-1?folders.length-1:fIdx];
  folder.items=folder.items||[];
  folder.items.push({title,content:content||'—',date,files:tempMemoFiles.slice(),ts:Date.now()});
  localStorage.setItem(PREFIX+'memo_folders',JSON.stringify(folders));
  tempMemoFiles=[];
  closeForm();render();
}
document.addEventListener('click', e => {
  if(e.target.id==='memoAdd'){openMemoFormWithFolder();return;}
  if(e.target.id==='memoAddFolder'){
    const name=(prompt('文件夹名称：')||'').trim();
    if(!name)return;
    let folders=[];
    try{const raw=localStorage.getItem(PREFIX+'memo_folders');if(raw)folders=JSON.parse(raw);}catch(e){}
    if(folders.find(f=>f.name===name)){toast('已存在同名文件夹');return;}
    folders.push({name,color:HABIT_COLORS[folders.length%HABIT_COLORS.length],items:[]});
    localStorage.setItem(PREFIX+'memo_folders',JSON.stringify(folders));
    state.activeFolder=name;render();
    return;
  }
  // 备忘录附件删除（已保存）
  const mmfile=e.target.closest('[data-mmfile]');
  if(mmfile){
    const [mi,fi]=mmfile.dataset.mmfile.split('__');
    let folders=[];

document.addEventListener('click', e => {
  const addgoal = e.target.closest('[data-addgoal]');
  if (addgoal) {
    const subject = prompt('科目名称：');
    if (!subject) return;
    const goal = prompt('目标描述：');
    if (!goal) return;
    const progress = prompt('当前进度（如 80%）：') || '';
    const tasks = prompt('今日对应任务（如 做3道高数题）：') || '';
    const goalsKey = PREFIX + 'subject_goals';
    let goals = [];
    try { const raw = localStorage.getItem(goalsKey); if (raw) goals = JSON.parse(raw); } catch(e) {}
    goals.push({ subject, goal, progress, tasks, id: uid() });
    localStorage.setItem(goalsKey, JSON.stringify(goals));
    render();
    return;
  }
  const goalDel = e.target.closest('[data-goaldel]');
  if (goalDel) {
    if (!confirm('删除这个科目目标？')) return;
    const goalsKey = PREFIX + 'subject_goals';
    let goals = [];
    try { const raw = localStorage.getItem(goalsKey); if (raw) goals = JSON.parse(raw); } catch(e) {}
    goals.splice(+goalDel.dataset.goaldel, 1);
    localStorage.setItem(goalsKey, JSON.stringify(goals));
    render();
    return;
  }
});

/* 阅读记录增强：摘抄感悟关联书单 */
function renderReadingV2(mid, sid) {
  const m = findModule(mid), s = findSub(mid, sid);
  if (!m || !s) return renderModule(mid);
  state.module = mid; state.sub = sid; state.guest = false; state.sched = null;
  const tab = state.rtab || 'books';
  const books = loadRead('read_books', [
    ['《置身事内》', '在读 · 68%', '-'],
    ['《原则》', '已读 · ★★★★', '-'],
    ['《小王子》', '想读', '-']
  ]);
  const quotes = loadRead('read_quotes', []);
  const notes = loadRead('read_notes', []);
  
  // Filter quotes/notes by book
  const bookQuotes = {};
  const bookNotes = {};
  quotes.forEach(q => {
    const book = q.vals[0] || '未分类';
    if (!bookQuotes[book]) bookQuotes[book] = [];
    bookQuotes[book].push(q);
  });
  notes.forEach(n => {
    const book = n.vals[0] || '未分类';
    if (!bookNotes[book]) bookNotes[book] = [];
    bookNotes[book].push(n);
  });

  const bookPanel = `
    <div class="toolbar">
      <div class="ph" style="margin:0"><span class="ic">📚</span> 我的书单</div>
      <button class="addbtn" data-addreadbook style="--cc:${m.cc}">＋ 添加书</button>
    </div>
    <table>
      <thead><tr><th style="width:8%">#</th><th style="width:30%">书名</th><th style="width:25%">进度</th><th style="width:15%">摘抄数</th><th style="width:15%">感悟数</th><th style="width:8%">操作</th></tr></thead>
      <tbody>
        ${books.length ? books.map((r, i) => {
          const bookName = r.vals[0] || '';
          const qCount = Object.keys(bookQuotes).filter(k => bookName.includes(k) || k.includes(bookName)).reduce((a, k) => a + bookQuotes[k].length, 0);
          const nCount = Object.keys(bookNotes).filter(k => bookName.includes(k) || k.includes(bookName)).reduce((a, k) => a + bookNotes[k].length, 0);
          return `<tr>
            <td style="color:var(--ink-faint)">${i + 1}</td>
            <td>${esc(r.vals[0])}</td>
            <td>${esc(r.vals[1] || '')}</td>
            <td><span class="chip">${qCount} 条</span></td>
            <td><span class="chip">${nCount} 条</span></td>
            <td><button class="delbtn" data-rbdel="${i}">删除</button></td>
          </tr>`;
        }).join('') : '<tr><td colspan="6"><div class="empty">书单还空着，添加第一本吧</div></td></tr>'}
      </tbody>
    </table>`;

  const quoteWall = quotes.length ? `<div class="quotewall">${quotes.map((q, i) => {
    const imgs = q.images || [];
    return `<div class="note" style="--rot:${READ_ROTS[i % READ_ROTS.length]}">
      <span class="ndel" data-rqdel="${i}">×</span>
      <div class="q">${esc(q.vals[1] || '')}</div>
      <div class="from">——《${esc(q.vals[0] || '')}》${q.vals[2] ? (' · ' + esc(q.vals[2])) : ''}</div>
      ${imgs.length ? `<div class="nimg" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">${imgs.map((im, fi) => `<div class="nimg"><img src="${im}" data-lb><span class="x" data-rqimgdel="${i}__${fi}">×</span></div>`).join('')}</div>` : ''}
    </div>`;
  }).join('')}</div>` : `<div class="empty">还没有摘抄，看到喜欢的句子就记下来吧 ✿</div>`;

  const noteWall = notes.length ? `<div class="quotewall">${notes.map((n, i) => {
    const imgs = n.images || [];
    return `<div class="note" style="--rot:${READ_ROTS[(i + 2) % READ_ROTS.length]}">
      <span class="ndel" data-rndel="${i}">×</span>
      <div class="q">${esc(n.vals[1] || '')}</div>
      <div class="from">——《${esc(n.vals[0] || '')}》${n.vals[2] ? (' · ' + esc(n.vals[2])) : ''}</div>
      ${imgs.length ? `<div class="nimg" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">${imgs.map((im, fi) => `<div class="nimg"><img src="${im}" data-lb><span class="x" data-rnimgdel="${i}__${fi}">×</span></div>`).join('')}</div>` : ''}
    </div>`;
  }).join('')}</div>` : `<div class="empty">读完一本书后，来写点自己的感悟吧 💭</div>`;

  const tabPanel = tab === 'books' ? bookPanel :
    tab === 'quotes' ? `<div class="toolbar"><div class="ph" style="margin:0"><span class="ic">📝</span> 读书摘抄</div><button class="addbtn" data-addreadq style="--cc:${m.cc}">＋ 记一条摘抄</button></div><div class="pd">看到喜欢的句子随手记下，还能配一张书的照片。</div>${quoteWall}` :
    `<div class="toolbar"><div class="ph" style="margin:0"><span class="ic">💭</span> 读书感悟</div><button class="addbtn" data-addreadn style="--cc:${m.cc}">＋ 写一段感悟</button></div><div class="pd">把读后的想法写下来，配图更生动。</div>${noteWall}`;

  view.innerHTML = `
    <nav class="crumbs"><button data-nav="home">Back to Room</button><span class="sep">/</span><button data-nav="module-growth">个人成长</button><span class="sep">/</span><span class="cur">阅读记录</span></nav>
    <div class="pagehead">
      <div><div class="colnum">GROWTH · READING</div><h1>📚 阅读记录</h1><p>书单 + 读书摘抄 + 读书感悟，摘抄和感悟都与具体书籍关联。</p></div>
      <div class="stat">${books.length} 本书<br>${quotes.length} 条摘抄 · ${notes.length} 条感悟</div>
    </div>
    <div class="deco">✦ 手帐式阅读 ✦</div>
    <div class="detail">
      <div class="panel" style="--cc:${m.cc}">
        <div class="tabbar">
          <button class="${tab === 'books' ? 'on' : ''}" data-rtab="books">📚 书单</button>
          <button class="${tab === 'quotes' ? 'on' : ''}" data-rtab="quotes">📝 读书摘抄</button>
          <button class="${tab === 'notes' ? 'on' : ''}" data-rtab="notes">💭 读书感悟</button>
        </div>
        ${tabPanel}
      </div>
    </div>`;
}

function cnImgDown(dataURL,max){
  return new Promise(res=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const r=max/Math.max(img.width,img.height);let w=img.width,h=img.height;if(r<1){w=Math.round(w*r);h=Math.round(h*r);}c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.82));};img.onerror=()=>res(dataURL);img.src=dataURL;});
}

}

  };
  function applyTheme(name){
    var t=themes[name];if(!t)return;
    var r=document.documentElement.style;
    r.setProperty('--bg',t.bg);r.setProperty('--bg2',t.bg2);r.setProperty('--card',t.card);
    r.setProperty('--line',t.line);r.setProperty('--line2',t.line2);r.setProperty('--ink',t.ink);

    r.setProperty('--lemon',t.lemon);r.setProperty('--lilac',t.lilac);r.setProperty('--blue',t.blue);
    localStorage.setItem('lifeArchive_theme',name);
    document.querySelectorAll('.theme-opt').forEach(function(el){
      el.classList.toggle('active',el.dataset.theme===name);
    });
  }
  document.addEventListener('click',function(e){
    if(e.target.id==='themeBtn'){
      document.querySelector('.theme-picker').classList.toggle('show');
      return;
    }
    if(e.target.classList.contains('theme-opt')){
      applyTheme(e.target.dataset.theme);
      document.querySelector('.theme-picker').classList.remove('show');
    }
    if(e.target.id==='themePickerClose'){
      document.querySelector('.theme-picker').classList.remove('show');
    }
  });
  var saved=localStorage.getItem('lifeArchive_theme')||'pink';
  applyTheme(saved);
})();

    }
    return;
  }
  // 技能/语言：打卡
  var skcheck = e.target.closest('[data-skcheck]');
  if (skcheck) {
    var sc = skcheck.dataset.skcheck.split('__');
    var scType = sc[0], scIdx = +sc[1];
    var scItems = loadSkillItems(scType);
    var scItem = scItems[scIdx];
    if (scItem) openSkillCheckForm(scType, scIdx, scItem.name);
    return;
  }
  // 技能/语言：查看某天打卡详情
  var skday = e.target.closest('[data-skday]');
  if (skday) {
    var sdp = skday.dataset.skday.split('__');
    state.skSel = { type: sdp[0], idx: +sdp[1], date: sdp[2] };
    render();

  }
  // 技能/语言：删除某次打卡
  var skchkdel = e.target.closest('[data-skchkdel]');
  if (skchkdel) {
    var kp = skchkdel.dataset.skchkdel.split('__');

    var kItem = kItems[+kp[1]];
    if (kItem && kItem.checkins) {
      delete kItem.checkins[kp[2]];
      saveSkillItems(kp[0], kItems);
      toast('已删除该次打卡');
      state.skSel = null; render();
    }
    return;
  }
  // 人类生活指南保存
  if (e.target.id === 'gdSave') { saveGuideForm(); return; }
  // 倒数日保存
  if (e.target.id === 'ddSave') { saveDaysForm(); return; }

    saveRows('timeline', 'career', rows);
    tempAttaches = [];
    render();
    return;
  }
  // 爱好培养保存(增强版)
  if (e.target.id === 'hbSave') {
    var hbName = (document.getElementById('hb_name') || {}).value || '';
    var hbDate = (document.getElementById('hb_date') || {}).value || nowStr();
    var hbMood = (document.getElementById('hb_mood') || {}).value || '';
    var hbTxt = (document.getElementById('hb_txt') || {}).value || '';

    if (!hbTxt && (!tempHobbyImg || !tempHobbyImg.length)) { alert('请写点文字或添加图片'); return; }

    saveRows('growth', 'hobby', rows);

    render();
    return;

/* 通用轻提示（补充页面缺失的 toast） */
function toast(msg){
  try{
    const t=document.createElement('div');
    t.textContent=msg;
    t.style.cssText='position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:rgba(90,70,80,.92);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;z-index:300;pointer-events:none;transition:opacity .3s';
    document.body.appendChild(t);
    setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),350);},2200);
  }catch(e){}
}

/* ---------- 重要日子 ---------- */
function loadMemorial(){try{const r=localStorage.getItem(PREFIX+'memorial');if(r!==null)return JSON.parse(r);}catch(e){}return [];}
function saveMemorial(a){try{localStorage.setItem(PREFIX+'memorial',JSON.stringify(a));}catch(e){}}
const MEM_TYPES=[['🎂','生日'],['❤','纪念日'],['💳','还款日'],['📌','其他']];
function memorialDays(date){
  const t=new Date();const d=new Date(date+'T00:00:00');if(isNaN(d))return 0;
  return Math.round((d.getTime()-t.getTime())/86400000);
}
function renderMemorial(mid,sid){
  injectModuleCss();
  const m=findModule(mid),s=findSub(mid,sid);
  const rows=loadMemorial().slice().sort((a,b)=>a.date<b.date?-1:1);
  let cards='';
  if(rows.length){
    cards=rows.map((r,i)=>{
      const diff=memorialDays(r.date);
      let txt,cls;
      if(diff===0){txt='就是今天 🎉';cls='mem-today';}
      else if(diff>0){txt='还有 '+diff+' 天';cls='mem-wait';}
      else{txt='已过 '+(-diff)+' 天';cls='mem-past';}
      return `<div class="memcard"><div class="memhead"><span class="memtype">${esc(r.type)}</span><b>${esc(r.name)}</b>${r.remind===false?'':`<span class="memtag">⏰ 提醒</span>`}<span class="memdel" data-memdel="${i}">×</span></div><div class="memdate">${esc(r.date)} · <span class="${cls}">${txt}</span></div>${r.note?`<div class="memnote">${esc(r.note)}</div>`:''}</div>`;
    }).join('');
  } else cards='<div class="empty">还没有重要日子，先记一个吧（生日、纪念日、还款日…）✿</div>';
  const typesOpts=MEM_TYPES.map(t=>`<option value="${t[1]}">${t[0]} ${t[1]}</option>`).join('');
  view.innerHTML=`
    <nav class="crumbs"><button data-nav="home">Back to Room</button><span class="sep">/</span><button data-nav="module-${m.id}">${esc(m.name)}</button><span class="sep">/</span><span class="cur">${esc(s.name)}</span></nav>
    <div class="pagehead"><div><div class="colnum">FEATURE · ${esc(m.en)}</div><h1>${s.ic} ${esc(s.name)}</h1><p>${esc(s.desc)}</p></div><div class="stat">已记录 <b style="color:var(--cc)">${rows.length}</b> 个日子</div></div>
    <div class="deco">✿ 重要日子 ✿</div>
    <div class="detail"><div class="panel" style="--cc:${m.cc}">
      <div class="toolbar"><div class="ph"><span class="ic">🎈</span> 我的重要日子</div></div>
      <div class="pd">记下生日、纪念日、还款日…到日子那天，会自动出现在「今日提醒」里。</div>
      <div class="memgrid">${cards}</div>
      <div class="memform" style="background:var(--bg2);border:1px dashed var(--line2);border-radius:14px;padding:14px">
        <b style="font-size:14px">＋ 记一个新日子</b>
        <div class="formrow" style="margin-top:10px">
          <select id="memType">${typesOpts}</select>
          <input type="text" id="memName" placeholder="名称，如：妈妈生日">
          <input type="date" id="memDate">
          <label class="chk"><input type="checkbox" id="memRemind" checked> 提醒</label>
        </div>
        <input type="text" id="memNote" placeholder="备注（可选）" style="margin-top:8px;border:1.5px solid var(--line2);border-radius:10px;padding:8px 12px;font-size:13.5px;outline:none;background:#fff;color:var(--ink);width:100%">
        <div style="margin-top:10px"><button class="addbtn" id="memSave" style="--cc:${m.cc}">＋ 保存这个日子</button></div>
      </div>
    </div></div>`;
  const save=document.getElementById('memSave');
  if(save)save.addEventListener('click',()=>{
    const name=document.getElementById('memName').value.trim();
    const date=document.getElementById('memDate').value;
    if(!name||!date){toast('请填写名称和日期');return;}
    const a=loadMemorial();
    a.push({id:Date.now(),type:document.getElementById('memType').value,name,date,note:document.getElementById('memNote').value.trim(),remind:document.getElementById('memRemind').checked});
    saveMemorial(a);render();toast('已保存重要日子');
  });
  document.querySelectorAll('[data-memdel]').forEach(el=>el.addEventListener('click',()=>{
    if(!confirm('删除这个日子？'))return;
    const a=loadMemorial();a.splice(+el.dataset.memdel,1);saveMemorial(a);render();
  }));
}

function loadRemindSettings(){try{const r=localStorage.getItem(PREFIX+'remind_settings');if(r)return JSON.parse(r);}catch(e){}return {signDays:7};}
function saveRemindSettings(o){try{localStorage.setItem(PREFIX+'remind_settings',JSON.stringify(o));}catch(e){}}
function loadRemindToday(){try{const r=localStorage.getItem(PREFIX+'remind_today');if(r)return JSON.parse(r);}catch(e){}return {date:'',done:{}};}
function saveRemindToday(o){try{localStorage.setItem(PREFIX+'remind_today',JSON.stringify(o));}catch(e){}}
function renderReminders(mid,sid){
  injectModuleCss();
  const m=findModule(mid),s=findSub(mid,sid);
  const today=nowStr();
  const settings=loadRemindSettings();
  const rt=loadRemindToday();
  if(rt.date!==today){rt.date=today;rt.done={};saveRemindToday(rt);}
  const isDone=k=>rt.done[k]===true;
  /* 今天该做的事：番茄钟待办 + 今日学习计划 */
  const pomo=loadPomoTasks().filter(x=>!x.done);
  const plan=loadStudyPlan()[today]||[];
  /* 重要日子：今天 */
  const mems=loadMemorial().filter(r=>r.remind!==false&&r.date===today);
  /* 该补的记录 */
  const signs=loadRows('health','signs');
  const lastSignTs=signs.length?Math.max.apply(null,signs.map(r=>r.ts||0)):0;
  const signDays=Math.floor((Date.now()-lastSignTs)/86400000);
  const flow=loadRows('money','flow');
  const flowToday=flow.some(r=>r.vals&&r.vals[2]===today);
  const mood=loadMood();
  const moodToday=mood.some(r=>r.date===today);
  const period=loadPeriod();
  const periodToday=(period.days||[]).indexOf(today)>=0;
  /* 习惯打卡 */
  const habits=loadHabits();
  const logs=loadHabitLogs();
  const habitsToday=habits.map(h=>({h,hk:'h'+h.id,hdone:((logs[h.id]||[]).some(l=>l.date===today))}));
  let todoHtml='',todoCnt=0,needCnt=0,memHtml='',dayCnt=0,habHtml='',habDone=0,needHtml='';
  if(pomo.length||plan.length){
    pomo.forEach((x,i)=>{
      todoCnt++;const k='p'+i;const d=isDone(k);
      todoHtml+=`<div class="remitem ${d?'done':''}"><span class="remck" data-rck="${k}">${d?'✓':''}</span><div><div class="rti">${esc(x.name)}</div><div class="rsu">番茄钟待办 · 预计 ${esc(x.duration||'25')} 分钟</div></div><span class="rbadge r1">待办</span></div>`;
    });
    plan.forEach((x,i)=>{
      todoCnt++;const k='pl'+i;const d=isDone(k);
      const nm=typeof x==='string'?x:(x.n||x.t||(x.vals&&x.vals[0])||'学习安排');
      todoHtml+=`<div class="remitem ${d?'done':''}"><span class="remck" data-rck="${k}">${d?'✓':''}</span><div><div class="rti">${esc(nm)}</div><div class="rsu">今日学习计划</div></div><span class="rbadge r1">学习</span></div>`;
    });
  } else todoHtml='<div class="remitem"><div class="rti" style="color:var(--ink-faint)">今天没有待办安排，可以享受放松 ✿</div></div>';
  if(mems.length){
    mems.forEach((x,i)=>{dayCnt++;const k='mem'+i;const d=isDone(k);
      memHtml+=`<div class="remitem ${d?'done':''}"><span class="remck" data-rck="${k}">${d?'✓':''}</span><div><div class="rti">${esc(x.name)} ${x.type}</div>${x.note?`<div class="rsu">${esc(x.note)}</div>`:''}</div><span class="rbadge r2">重要日子</span></div>`;
    });
  } else memHtml='<div class="remitem"><div class="rti" style="color:var(--ink-faint)">今天没有特别的日子</div></div>';
  const needItems=[];
  if(settings.signDays>0&&signs.length===0)needItems.push({k:'n_sign',t:'体征测量',su:'还没有体征记录，方便时记一次',b:'r4'});
  else if(settings.signDays>0&&signDays>=settings.signDays)needItems.push({k:'n_sign',t:'体征测量',su:'已经 '+signDays+' 天没记体重/心率了',b:'r4'});
  if(!flowToday)needItems.push({k:'n_flow',t:'记账',su:'今天还没记录收支',b:'r3'});
  if(!moodToday)needItems.push({k:'n_mood',t:'心情日记',su:'今天还没记录心情',b:'r5'});
  if(periodToday)needItems.push({k:'n_period',t:'经期记录',su:'今天是经期日，方便时标记一下',b:'r4'});
  needItems.forEach((it)=>{needCnt++;const d=isDone(it.k);
    needHtml+=`<div class="remitem ${d?'done':''}"><span class="remck" data-rck="${it.k}">${d?'✓':''}</span><div><div class="rti">${it.t}</div><div class="rsu">${it.su}</div></div><span class="rbadge ${it.b}">该补</span></div>`;
  });
  if(!needItems.length)needHtml='<div class="remitem"><div class="rti" style="color:var(--ink-faint)">该记的都记上啦，棒棒 ✿</div></div>';
  habitsToday.forEach((h)=>{if(h.hdone)habDone++;const d=isDone(h.hk);
    habHtml+=`<div class="remitem ${d?'done':''}"><span class="remck" data-rck="${h.hk}">${d?'✓':''}</span><div><div class="rti">${esc(h.h.name)}</div>${h.h.goal?`<div class="rsu">${esc(h.h.goal)}</div>`:''}</div><span class="rbadge r2">${h.hdone?'已打卡':'待打卡'}</span></div>`;
  });
  if(!habits.length)habHtml='<div class="remitem"><div class="rti" style="color:var(--ink-faint)">还没有设置习惯</div></div>';
  const signOpts=[['7','7 天没记才提醒'],['14','14 天没记才提醒'],['30','30 天没记才提醒'],['0','不提醒体征']].map(o=>`<option value="${o[0]}" ${String(settings.signDays)===o[0]?'selected':''}>${o[1]}</option>`).join('');
  view.innerHTML=`
    <nav class="crumbs"><button data-nav="home">Back to Room</button><span class="sep">/</span><button data-nav="module-${m.id}">${esc(m.name)}</button><span class="sep">/</span><span class="cur">${esc(s.name)}</span></nav>
    <div class="pagehead"><div><div class="colnum">FEATURE · ${esc(m.en)}</div><h1>${s.ic} ${esc(s.name)}</h1><p>${esc(s.desc)}</p></div><div class="stat">今天 <b style="color:var(--cc)">${todoCnt+dayCnt+needCnt}</b> 件事</div></div>
    <div class="deco">✿ 今日提醒 ✿</div>
    <div class="detail">
      <div class="panel" style="--cc:${m.cc}">
        <div class="toolbar"><div class="ph"><span class="ic">⚙</span> 提醒设置</div></div>
        <div class="setrow" style="padding:4px 2px 12px">
          <span>🔔 体征提醒频率：</span>
          <select id="signFreq">${signOpts}</select>
          <span>（按天记的：记账、心情、经期每天都会提醒）</span>
        </div>
      </div>
      <div class="panel" style="--cc:${m.cc}">
        <div class="toolbar"><div class="ph"><span class="ic">🗓</span> 今天该做的事</div><span class="stat" style="font-size:12px;color:var(--ink-faint)">${todoCnt} 项</span></div>
        ${todoHtml}
      </div>
      <div class="panel" style="--cc:${m.cc}">
        <div class="toolbar"><div class="ph"><span class="ic">🎈</span> 重要日子</div><span class="stat" style="font-size:12px;color:var(--ink-faint)">${dayCnt} 个今天</span></div>
        ${memHtml}
      </div>
      <div class="panel" style="--cc:${m.cc}">
        <div class="toolbar"><div class="ph"><span class="ic">📝</span> 该补的记录</div><span class="stat" style="font-size:12px;color:var(--ink-faint)">${needCnt} 项</span></div>
        ${needHtml}
      </div>
      <div class="panel" style="--cc:${m.cc}">
        <div class="toolbar"><div class="ph"><span class="ic">✅</span> 习惯打卡</div><span class="stat" style="font-size:12px;color:var(--ink-faint)">${habDone} / ${habits.length}</span></div>
        ${habHtml}
      </div>
    </div>`;
  document.getElementById('signFreq').addEventListener('change',function(){settings.signDays=parseInt(this.value);saveRemindSettings(settings);toast('体征提醒频率已更新');});
  document.querySelectorAll('[data-rck]').forEach(el=>el.addEventListener('click',()=>{
    const rt2=loadRemindToday();rt2.done[el.dataset.rck]=!rt2.done[el.dataset.rck];saveRemindToday(rt2);renderReminders(mid,sid);
  }));
}

function wbBuildNav(){
  let h='';
  h+='<div class="wb-home" data-wbh="home">♡ Back to Room</div>';
  h+='<div class="wb-nav-sec">全部模块</div>';
  DATA.forEach(mod=>{
    h+='<div class="wb-mod" data-modid="'+mod.id+'">';
    h+='<div class="wb-mod-head" data-mid="'+mod.id+'"><span>'+esc(mod.name)+'</span><span class="wb-arr">›</span></div>';
    h+='<div class="wb-subs">'+mod.sub.map(s=>'<div class="wb-sub" data-nav="sub-'+mod.id+'-'+s.id+'"><span class="wb-dotline"></span><span>'+esc(s.name)+'</span></div>').join('')+'</div>';
    h+='</div>';
  });
  return h;
}
function wbToday(){
  const t=new Date();
  const lines=[];
  try{
    const tasks=loadPomoTasks();const nt=tasks.filter(x=>!x.done);
    if(nt.length)lines.push({t:'待办',txt:nt.slice(0,3).map(x=>x.name).join('、')+(nt.length>3?' 等'+nt.length+'项':''),go:'sub-utility-pomodoro'});
    const mem=loadMemorial();const iso=todayISO2();
    mem.forEach(x=>{if(x.remind!==false&&x.date===iso)lines.push({t:'日子',txt:x.type+'：'+x.name,go:'sub-utility-memorial'});});
    const period=loadPeriod();const ds=period.days||[];
    if(ds.indexOf(iso)>=0)lines.push({t:'经期',txt:'今天是经期日',go:'sub-health-period'});
    const flows=loadRows('money','flow');
    const todayHave=flows.some(r=>r.vals&&r.vals[2]===todayISO2());
    if(!todayHave&&flows.length)lines.push({t:'记账',txt:'今天还没记账',go:'sub-money-flow'});
    const moods=loadMood();if(!moods[iso])lines.push({t:'心情',txt:'今天还没打卡心情',go:'sub-growth-mood'});
  }catch(e){}
  return lines;
}
function wbHabitsHtml(){
  try{
    const habits=loadHabits(),logs=loadHabitLogs(),today=nowStr();
    if(!habits.length)return '<div class="wb-empty">还没有习惯，去「习惯打卡」添加</div>';
    return habits.map(hab=>{
      const done=(logs[hab.id]||[]).some(l=>l.date===today);
      const sk=streakOf(logs[hab.id]||[],today);
      return '<div class="wb-hab'+(done?' on':'')+'" data-wbhab="'+hab.id+'"><span class="wb-check'+(done?' on':'')+'">'+(done?'✓':'')+'</span><span class="wb-hname">'+esc(hab.name)+'</span><span class="wb-streak">'+sk+'天</span></div>';
    }).join('');
  }catch(e){return '';}
}
function wc(code){
  if(code===0)return ['☀️','晴']; if(code<=2)return ['🌤','少云']; if(code===3)return ['☁️','多云'];
  if(code>=45&&code<=48)return ['🌫','雾']; if(code>=51&&code<=67)return ['🌧','雨'];
  if(code>=71&&code<=77)return ['🌨','雪']; if(code>=80&&code<=82)return ['🌦','阵雨'];
  if(code>=95)return ['⛈','雷雨']; return ['☁️','未知'];
}
let weatherCity='hz';
const WCITIES={hz:{name:'杭州',lat:30.25,lon:120.15},jx:{name:'嘉兴',lat:30.77,lon:120.75}};
function wbWeather(){
  const el=document.getElementById('wb-weather');if(!el)return;
  const cur=WCITIES[weatherCity],other=weatherCity==='hz'?'jx':'hz',otherName=WCITIES[other].name;
  const btn='<button class="wb-wcity" id="wbCityBtn" title="切换城市">⇄ '+otherName+'</button>';
  el.innerHTML='<div class="ck">天气 · '+cur.name+btn+'</div><div class="wb-wloading">正在获取天气…</div>';
  (async()=>{try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+cur.lat+'&longitude='+cur.lon+'&current_weather=true&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FShanghai');
    const d=await r.json();const c=d.current_weather,wt=wc(c.weathercode);
    const dw=['一','二','三','四','五','六','日'];let dl='';
    if(d.daily){for(let i=0;i<5;i++){dl+='<div class="wb-wd"><span>'+dw[(new Date(d.daily.time[i]).getDay()+6)%7]+'</span><span class="wb-wdmax">'+Math.round(d.daily.temperature_2m_max[i])+'°</span></div>';}}
    el.innerHTML='<div class="ck">天气 · '+cur.name+btn+'</div><div class="wb-wmain"><span class="wb-wico">'+wt[0]+'</span><span class="wb-wtemp">'+Math.round(c.temperature)+'°</span><span class="wb-wtxt">'+wt[1]+'</span></div><div class="wb-wdrow">'+dl+'</div>';
  }catch(e){el.innerHTML='<div class="ck">天气 · '+cur.name+btn+'</div><div class="wb-empty">离线时无法获取，稍后自动更新</div>';}})();
}
document.addEventListener('click',e=>{if(e.target&&e.target.id==='wbCityBtn'){weatherCity=weatherCity==='hz'?'jx':'hz';wbWeather();}});
function wbBuildRbar(){
  const t=new Date();
  const wk=['日','一','二','三','四','五','六'][t.getDay()];
  let h='<div class="wb-title">今日</div>';
  h+='<div class="wb-datecard"><div class="d1">'+(t.getMonth()+1)+'月 '+t.getDate()+' 日</div><div class="d2">'+t.getFullYear()+' 年 · 周'+wk+'</div></div>';
  h+='<div class="wb-card" id="wb-weather"><div class="ck">天气 · 杭州</div><div class="wb-wloading">正在获取天气…</div></div>';
  h+='<div class="wb-card"><div class="ck">习惯打卡</div><div id="wb-habs">'+wbHabitsHtml()+'</div></div>';
  h+='<div class="wb-card"><div class="ck">今日概览</div>';
  const lines=wbToday();
  if(lines.length)h+=lines.map(l=>'<div class="wb-line" data-wbgoto="'+l.go+'"><span class="dot"></span><span class="wt">'+l.t+'</span><span>'+esc(l.txt)+'</span></div>').join('');
  else h+='<div class="wb-empty">今天还没有待办和记录，享受生活吧</div>';
  h+='</div>';
  h+='<div class="wb-card"><div class="ck">快捷入口</div><div class="wb-quick">';
  [['signs','体征'],['period','经期'],['flow','记账'],['mood','心情'],['habit','习惯'],['pomodoro','番茄钟'],['diary','日记'],['work','工作留档'],['goals','年度目标']].forEach(q=>{
    h+='<span class="wb-q" data-wbgoto="sub-'+(q[0]==='flow'?'money':q[0]==='period'||q[0]==='signs'?'health':q[0]==='habit'||q[0]==='pomodoro'?'utility':q[0]==='mood'?'growth':q[0]==='diary'?'timeline':q[0]==='goals'?'timeline':'utility')+'-'+q[0]+'">'+q[1]+'</span>';
  });
  h+='</div></div>';
  h+='<div class="wb-cal">'+wbCalHtml()+'</div>';
  return h;
}
function todayISO2(){const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
function wbCalHtml(){
  const v=wbCalView,y=v.getFullYear(),m=v.getMonth();
  const first=new Date(y,m,1),start=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate();
  const td=new Date();
  let g='<div class="wb-cal-head"><span>'+y+' / '+(m+1)+'</span><span class="nav"><button data-wbcal="prev">‹</button><button data-wbcal="next">›</button></span></div>';
  g+='<div class="wb-cal-grid">'+['一','二','三','四','五','六','日'].map(d=>'<div class="wb-dow">'+d+'</div>').join('');
  for(let i=0;i<start;i++)g+='<div class="wb-day other"></div>';
  for(let d=1;d<=dim;d++){const isT=(y===td.getFullYear()&&m===td.getMonth()&&d===td.getDate());g+='<div class="wb-day'+(isT?' today':'')+'" data-wbdate="'+y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')+'">'+d+'</div>';}
  g+='</div>';
  return g;
}
function updateWbState(){
  const side=document.getElementById('wside');if(!side)return;
  side.querySelectorAll('.wb-mod').forEach(mod=>mod.classList.remove('open'));
  side.querySelectorAll('.wb-sub').forEach(s=>s.classList.remove('active'));
  side.querySelectorAll('.wb-home').forEach(h=>h.classList.remove('active'));
  if(state.module){
    const mod=side.querySelector('[data-modid="'+state.module+'"]');if(mod)mod.classList.add('open');
  }
  if(state.module&&state.sub){
    const s=side.querySelector('[data-nav="sub-'+state.module+'-'+state.sub+'"]');if(s)s.classList.add('active');
  }else if(state.module&&!state.sub){
    const home=side.querySelector('.wb-home');if(home)home.classList.remove('active');
  }
}
function toggleWorkbench(force){
  const app=document.getElementById('app');
  const turnOn=force===true?true:force===false?false:!wbOn;
  const ols=document.getElementById('wside'),olr=document.getElementById('wrbar');
  if(turnOn){
    document.body.classList.add('workbench');
    if(ols)ols.remove();if(olr)olr.remove();
    const side=document.createElement('aside');side.id='wside';side.innerHTML=wbBuildNav();
    const rbar=document.createElement('aside');rbar.id='wrbar';rbar.innerHTML=wbBuildRbar();
    app.insertBefore(side,app.firstChild);app.appendChild(rbar);
    const bn=document.createElement('div');bn.id='wbbanner';
    const now=new Date();bn.innerHTML='<div class="wb-mt">In the infinity of life where I am, all is perfect, whole, and complete.</div><div class="wb-md">'+(now.getMonth()+1)+' 月 '+now.getDate()+' 日 · '+now.getFullYear()+'</div>';
    app.appendChild(bn);
    side.addEventListener('click',e=>{
      const mh=e.target.closest('[data-mid]');if(mh){const mod=side.querySelector('[data-modid="'+mh.dataset.mid+'"]');if(mod)mod.classList.toggle('open');return;}
      const sub=e.target.closest('[data-nav]');if(sub){navigate(sub.dataset.nav);updateWbState();return;}
      const hm=e.target.closest('[data-wbh]');if(hm){navigate('home');updateWbState();return;}
    });
    rbar.addEventListener('click',e=>{
      const hab=e.target.closest('[data-wbhab]');
      if(hab){const id=hab.dataset.wbhab;const logs=loadHabitLogs();const arr=logs[id]||[];const today=nowStr();const ix=arr.findIndex(l=>l.date===today);if(ix>=0)arr.splice(ix,1);else arr.push({date:today,note:''});logs[id]=arr;saveHabitLogs(logs);const box=document.getElementById('wb-habs');if(box)box.innerHTML=wbHabitsHtml();return;}
      const g=e.target.closest('[data-wbgoto]');if(g){navigate(g.dataset.wbgoto);updateWbState();return;}
      const c=e.target.closest('[data-wbcal]');if(c){wbCalView=new Date(wbCalView.getFullYear(),wbCalView.getMonth()+(c.dataset.wbcal==='next'?1:-1),1);const cal=rbar.querySelector('.wb-cal');if(cal)cal.innerHTML=wbCalHtml();return;}
    });
    render();updateWbState();wbWeather();
  }else{
    document.body.classList.remove('workbench');
    if(ols)ols.remove();if(olr)olr.remove();
    const obn=document.getElementById('wbbanner');if(obn)obn.remove();
    render();
  }
  wbOn=turnOn;
  const btn=document.getElementById('wbToggleBtn');
  if(btn)btn.textContent=turnOn?'⊟ 简洁':'⊞ 工作台';
}
document.addEventListener('click',e=>{
  if(e.target.id==='wbToggleBtn'){toggleWorkbench();return;}
  if(document.body.classList.contains('workbench')){
    const g=e.target.closest('[data-wbhgo]');
    if(g){if(g.dataset.wbhgo==='guest')navigate('guest');else navigate(g.dataset.wbhgo);updateWbState();return;}
  }
});
window.toggleWorkbench=toggleWorkbench;

/* ===== 电子宠物 · 小狗 & 小猫 ===== */
const PET_KEY=PREFIX+'pet';
function loadPets(){try{const r=localStorage.getItem(PET_KEY);if(r){const p=JSON.parse(r);if(p&&p.dog&&p.cat)return p;}}catch(e){}const p={dog:{name:'小白',hunger:80,thirst:80,lastTs:Date.now()},cat:{name:'甜菜',hunger:80,thirst:80,lastTs:Date.now()}};try{localStorage.setItem(PET_KEY,JSON.stringify(p));}catch(e){}return p;}
function savePets(p){try{localStorage.setItem(PET_KEY,JSON.stringify(p));}catch(e){}}
let petActive='dog';
function petRefresh(){
  const p=loadPets(),a=p[petActive];
  const mt=document.getElementById('petMenuTitle'),h=document.getElementById('petHunger'),t=document.getElementById('petThirst'),s=document.getElementById('petState');
  if(mt)mt.textContent=a.name;
  if(h)h.style.width=Math.max(0,Math.min(100,a.hunger))+'%';
  if(t)t.style.width=Math.max(0,Math.min(100,a.thirst))+'%';
  if(s){if(a.hunger<30&&a.thirst<30)s.textContent='好饿又好渴…';else if(a.hunger<30)s.textContent='肚子有点饿';else if(a.thirst<30)s.textContent='有点口渴';else s.textContent='快乐玩耍中';}
  ['dog','cat'].forEach(k=>{const b=document.getElementById('petBody'+(k==='dog'?'Dog':'Cat'));if(!b)return;const q=loadPets()[k];b.classList.remove('happy');b.classList.remove('sad');if(q.hunger<30||q.thirst<30)b.classList.add('sad');else b.classList.add('happy');});
}
function petBubble(k,txt){const b=document.getElementById('petBubble'+(k==='dog'?'Dog':'Cat'));if(!b)return;b.textContent=txt;b.classList.add('show');clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('show'),1900);}
let petMenuOpen=false;
function petWag(k){const b=document.getElementById('petBody'+(k==='dog'?'Dog':'Cat'));if(b){b.classList.remove('wag');void b.offsetWidth;b.classList.add('wag');}setTimeout(()=>b&&b.classList.remove('wag'),650);}
let petClickTimer=null;
function petToggleMenu(k){petActive=k;petMenuOpen=!petMenuOpen;const m=document.getElementById('petMenu');if(m)m.classList.toggle('show',petMenuOpen);petRefresh();}
document.addEventListener('click',e=>{
  const dogEl=e.target.closest('#petDog'),catEl=e.target.closest('#petCat');

  if(e.target.id==='petFeed'){const p=loadPets();p[petActive].hunger=Math.min(100,p[petActive].hunger+25);savePets(p);petWag(petActive);petRefresh();petBubble(petActive,'好吃～ 饱食 +25');return;}
  if(e.target.id==='petWater'){const p=loadPets();p[petActive].thirst=Math.min(100,p[petActive].thirst+25);savePets(p);petWag(petActive);petRefresh();petBubble(petActive,'咕嘟咕嘟～ 水分 +25');return;}

document.addEventListener('dblclick',e=>{

  clearTimeout(petClickTimer);
  petToggleMenu(dogEl?'dog':'cat');
});
setInterval(()=>{const p=loadPets();const now=Date.now();let dirty=false;['dog','cat'].forEach(k=>{const mins=(now-p[k].lastTs)/60000;if(mins>0.2){p[k].hunger=Math.max(0,p[k].hunger-mins*0.35);p[k].thirst=Math.max(0,p[k].thirst-mins*0.45);p[k].lastTs=now;dirty=true;}});if(dirty){savePets(p);petRefresh();}},60000);
